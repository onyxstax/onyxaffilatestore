<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #333;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .product {
            border: 1px solid #ddd;
            margin: 10px;
            padding: 10px;
            text-align: center;
            border-radius: 5px;
        }
        .product img {
            max-width: 100%;
            height: auto;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Your Amazon Affiliate Store</h1>
    </header>
    <div class="container">
        <h2>Featured Products</h2>
        <div class="product">
            <img src="placeholder1.jpg" alt="Product 1">
            <h3>Product Title 1</h3>
            <p>Product description goes here.</p>
            <a href="https://affiliate.link/product1">Buy Now</a>
        </div>
        <div class="product">
            <img src="placeholder2.jpg" alt="Product 2">
            <h3>Product Title 2</h3>
            <p>Product description goes here.</p>
            <a href="https://affiliate.link/product2">Buy Now</a>
        </div>
        <div class="product">
            <img src="placeholder3.jpg" alt="Product 3">
            <h3>Product Title 3</h3>
            <p>Product description goes here.</p>
            <a href="https://affiliate.link/product3">Buy Now</a>
        </div>
    </div>
    <footer>
        <p>© 2026 Your Amazon Affiliate Store</p>
    </footer>
</body>
</html>
